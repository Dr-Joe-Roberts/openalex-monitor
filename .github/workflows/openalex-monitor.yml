name: Update OpenAlex metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/openalex-monitor.yml"
      - "monitor.py"
      - "requirements.txt"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: openalex-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Fetch OpenAlex data
        run: python monitor.py

      - name: Commit changed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data plots
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update OpenAlex metrics"
            git push
          fi
